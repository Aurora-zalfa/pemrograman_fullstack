<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Distribusi - Dashboard Monitoring Sawit</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>Distribusi App</h3>
      </div>
      
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="master">
          <i class="fas fa-database"></i>
          <span>Data Master</span>
        </a>
        <a href="#" class="nav-item" data-page="transaksi">
          <i class="fas fa-exchange-alt"></i>
          <span>Transaksi</span>
        </a>
        <a href="#" class="nav-item" data-page="laporan">
          <i class="fas fa-chart-bar"></i>
          <span>Laporan</span>
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <nav class="navbar">
        <div class="navbar-toggle" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </div>
        <div class="navbar-user">
          <span id="userName">User</span>
          <span class="user-role" id="userRole">Loading...</span>
        </div>
      </nav>

      <div class="content-wrapper" id="contentWrapper">
        <!-- Dashboard Content (Default) -->
        <div class="dashboard">
          <h1>Dashboard Monitoring Sawit</h1>
          <div class="stats-grid">
            <div class="stat-card">
              <h3>Total Berat TBS</h3>
              <p id="totalBerat">0 Kg</p>
            </div>
            <div class="stat-card">
              <h3>Jumlah Pengiriman</h3>
              <p id="totalPengiriman">0</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
